name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version
        run: node scripts/verify-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Test release version checks
        run: node --test scripts/verify-release-check.mjs

      - name: Verify signing key is configured
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Add TAURI_SIGNING_PRIVATE_KEY in repository Settings > Secrets and variables > Actions."
          }

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --locked

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

      # beforeBuildCommand runs npm run build; assets remain draft until reviewed.
      - name: Build signed draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Smart Invoice ${{ github.ref_name }}
          releaseBody: "Tải bộ cài Windows x64 bên dưới."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --ci --target x86_64-pc-windows-msvc --bundles nsis -- --locked
